name: Test quote generation (no posting)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate (dry run)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py prepare
          python -c "import json;p=json.load(open('data/pending.json'));print('::notice::SOURCE=' + p['source'] + ' | ' + p['quote'])"
      - uses: actions/upload-artifact@v4
        with:
          name: sample-post
          path: posts/*.jpg
